<style>
  :root{
    --bg:#0F0F0D;
    --bg-card:#171715;
    --bg-raised:#1E1E1B;
    --text:#F2F1EC;
    --text-muted:#A1A198;
    --border:#2A2A26;
    --border-hover:#1F7FA0;
    --accent:#3AC9F0;
    --accent-bright:#79F0FF;
    --accent-text:#04141A;
    --radius:14px;
    --dock-h:56px;
    color-scheme: dark;
  }
  *{box-sizing:border-box;}
  button, a{-webkit-tap-highlight-color:transparent; touch-action:manipulation;}
  html{scroll-padding-top:env(safe-area-inset-top,0px); -webkit-text-size-adjust:100%;}
  /* Scrollbar bawaan browser disembunyikan; halaman tetap bisa di-scroll (roda mouse, sentuh, keyboard).
     Yang tampil adalah scrollbar buatan di bawah (.sb). */
  html{scrollbar-width:none; -ms-overflow-style:none;}
  html::-webkit-scrollbar, body::-webkit-scrollbar{display:none; width:0; height:0;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
    line-height:1.5;
    min-height:100vh; min-height:100dvh;
    display:flex; flex-direction:column;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  #matrixCanvas{position:fixed; inset:0; width:100%; height:100%; z-index:0; pointer-events:none; display:block;}
  /* Vinyet: bikin latar lebih redup di tengah supaya konten tetap terbaca */
  .vignette{
    position:fixed; inset:0; z-index:0; pointer-events:none;
    background:radial-gradient(ellipse at 50% 35%, rgba(15,15,13,.55) 0%, rgba(15,15,13,.22) 55%, rgba(15,15,13,0) 100%);
  }

  .wrap{
    flex:1; width:100%; max-width:1040px; margin:0 auto;
    padding:64px 20px 40px; position:relative; z-index:1;
  }

  /* ---------- Header ---------- */
  header{text-align:center; margin-bottom:40px;}
  h1{
    font-family:'Space Grotesk',sans-serif; font-weight:700;
    font-size:clamp(2.6rem,8vw,4.2rem); letter-spacing:-0.03em; line-height:1;
    margin:0 auto; width:fit-content;
  }
  /* Logo gambar di atas judul */
  .hero-mark{
    display:block; width:auto; height:clamp(70px,15vw,100px); max-width:70vw;
    margin:0 auto 12px; user-select:none; -webkit-user-drag:none;
  }
  .hero-mark, .hero-title, .hero-desc{transition:opacity .35s ease;}
  .hero-mark.is-docked, .hero-title.is-docked, .hero-desc.is-docked{
    opacity:0; visibility:hidden; transition:opacity .25s ease, visibility 0s .25s;
  }
  /* ---------- PRESET GLOW "Klee" ----------
     Ganti preset dengan mengubah atribut di tag <html>, contoh: <html lang="id" data-glow="biru">
     Pilihan: mati, lembut, neon, ekstrem, biru, ungu, pink, emas, pulse, kedip
     Untuk mencoba cepat tanpa mengedit file, buka halaman dengan  ?glow=nama  (contoh: index.html?glow=ungu) */
  :root{
    --glow-neon:0 0 .08em rgba(163,247,233,0.95), 0 0 .25em rgba(163,247,233,0.75), 0 0 .6em rgba(163,247,233,0.55), 0 0 1.2em rgba(111,230,214,0.4), 0 0 2em rgba(111,230,214,0.22);
    --glow:var(--glow-neon);
  }
  .klee-accent{
    color:var(--glow-text, var(--accent-bright));
    text-shadow:var(--glow);
  }
  [data-glow="mati"]{ --glow:none; }
  [data-glow="lembut"]{ --glow:0 0 .12em rgba(163,247,233,.5), 0 0 .5em rgba(163,247,233,.28); }
  [data-glow="neon"]{ --glow:var(--glow-neon); }
  [data-glow="ekstrem"]{
    --glow:0 0 .06em rgba(255,255,255,.9), 0 0 .2em rgba(163,247,233,1), 0 0 .5em rgba(163,247,233,.9),
           0 0 1em rgba(111,230,214,.75), 0 0 1.8em rgba(111,230,214,.55), 0 0 3em rgba(111,230,214,.35);
  }
  [data-glow="biru"]{ --glow-text:#CFE6FF; --glow:0 0 .08em rgba(120,180,255,0.95), 0 0 .25em rgba(120,180,255,0.75), 0 0 .6em rgba(120,180,255,0.55), 0 0 1.2em rgba(80,140,255,0.4), 0 0 2em rgba(80,140,255,0.22); }
  [data-glow="ungu"]{ --glow-text:#E6D4FF; --glow:0 0 .08em rgba(176,130,255,0.95), 0 0 .25em rgba(176,130,255,0.75), 0 0 .6em rgba(176,130,255,0.55), 0 0 1.2em rgba(140,90,255,0.4), 0 0 2em rgba(140,90,255,0.22); }
  [data-glow="pink"]{ --glow-text:#FFD6EA; --glow:0 0 .08em rgba(255,120,185,0.95), 0 0 .25em rgba(255,120,185,0.75), 0 0 .6em rgba(255,120,185,0.55), 0 0 1.2em rgba(255,80,160,0.4), 0 0 2em rgba(255,80,160,0.22); }
  [data-glow="emas"]{ --glow-text:#FFEDB5; --glow:0 0 .08em rgba(255,196,80,0.95), 0 0 .25em rgba(255,196,80,0.75), 0 0 .6em rgba(255,196,80,0.55), 0 0 1.2em rgba(255,160,40,0.4), 0 0 2em rgba(255,160,40,0.22); }
  /* Preset beranimasi */
  [data-glow="pulse"] .klee-accent{ animation:glow-pulse 2.8s ease-in-out infinite; }
  [data-glow="kedip"] .klee-accent{ animation:glow-kedip 5s linear infinite; }
  @keyframes glow-pulse{
    0%,100%{ text-shadow:0 0 .1em rgba(163,247,233,.6), 0 0 .4em rgba(163,247,233,.35), 0 0 .9em rgba(111,230,214,.2); }
    50%{ text-shadow:0 0 .06em rgba(255,255,255,.85), 0 0 .2em rgba(163,247,233,1), 0 0 .55em rgba(163,247,233,.85), 0 0 1.2em rgba(111,230,214,.6), 0 0 2.2em rgba(111,230,214,.4); }
  }
  @keyframes glow-kedip{
    0%,18%,24%,60%,63%,100%{ text-shadow:var(--glow-neon); opacity:1; }
    20%,22%,61%{ text-shadow:0 0 .04em rgba(163,247,233,.25); opacity:.78; }
  }
  @media (prefers-reduced-motion: reduce){
    [data-glow="pulse"] .klee-accent, [data-glow="kedip"] .klee-accent{ animation:none; }
  }
  header p{color:var(--text-muted); margin:14px auto 0; font-size:1.02rem; max-width:44ch;}

  /* ---------- Search ---------- */
  .search-bar{
    position:sticky; top:calc(env(safe-area-inset-top,0px) + var(--dock-h) + 20px); z-index:5;
    display:flex; flex-direction:column; align-items:center; gap:8px;
    padding:12px 0; margin-bottom:12px;
  }
  .search-box{position:relative; width:100%; max-width:480px;}
  /* z-index:1 penting: kolom input punya backdrop-filter sehingga membentuk lapisan sendiri
     dan akan menutupi ikon yang berada di belakangnya dalam urutan HTML */
  .search-box svg{
    position:absolute; z-index:1; left:15px; top:50%; transform:translateY(-50%);
    width:20px; height:20px; color:var(--text-muted); pointer-events:none;
    transition:color .2s ease;
  }
  .search-box:focus-within > svg{color:var(--accent-bright);}
  #search{
    width:100%; padding:13px 44px 13px 46px; border-radius:12px;
    border:1px solid var(--border); background:rgba(23,23,21,.62);
    -webkit-backdrop-filter:blur(14px) saturate(1.3); backdrop-filter:blur(14px) saturate(1.3);
    color:var(--text); font:inherit; font-size:.97rem;
    transition:border-color .15s ease, box-shadow .15s ease;
    -webkit-appearance:none; appearance:none;
  }
  #search::placeholder{color:#7E7E76;}
  #search::-webkit-search-cancel-button{display:none;}
  #search:hover{border-color:#3A3A35;}
  #search:focus{outline:none; border-color:var(--accent); box-shadow:0 0 0 3px rgba(111,163,155,.25);}
  .kbd{
    position:absolute; z-index:1; right:12px; top:50%; transform:translateY(-50%);
    font-size:.72rem; color:var(--text-muted); border:1px solid var(--border);
    border-radius:6px; padding:1px 7px; background:var(--bg-raised); pointer-events:none;
  }
  #clear{
    position:absolute; z-index:1; right:8px; top:50%; transform:translateY(-50%);
    width:30px; height:30px; border:0; border-radius:8px; cursor:pointer;
    background:transparent; color:var(--text-muted); display:none;
    align-items:center; justify-content:center;
  }
  #clear svg{position:static; transform:none; width:16px; height:16px;}
  #clear:hover{background:var(--bg-raised); color:var(--text);}
  #clear:focus-visible{outline:2px solid var(--accent); outline-offset:1px;}
  .search-box.has-value #clear{display:flex;}
  .search-box.has-value .kbd{display:none;}
  .count{font-size:.82rem; color:var(--text-muted); min-height:1.2em; text-align:center; margin:0 0 16px;}

  /* ---------- Scrollbar buatan ---------- */
  .sb{
    position:fixed; z-index:40; right:3px; width:14px;
    top:calc(env(safe-area-inset-top,0px) + 8px);
    bottom:calc(env(safe-area-inset-bottom,0px) + 8px);
    border-radius:999px; opacity:0; transition:opacity .35s ease, background-color .2s ease;
    touch-action:none;
  }
  .sb.no-scroll{display:none;}
  .sb.is-active, .sb.is-drag{opacity:1;}
  .sb-thumb{
    position:absolute; top:0; right:2px; width:6px; min-height:40px; border-radius:999px;
    background:rgba(58, 201, 240,.6);
    box-shadow:0 0 0 1px rgba(15,15,13,.35);
    will-change:transform; touch-action:none; cursor:grab;
    transition:width .18s ease, background-color .18s ease;
  }
  /* Area sentuh diperlebar supaya mudah diraih jari */
  .sb-thumb::before{content:""; position:absolute; top:0; bottom:0; left:-12px; right:-6px;}
  .sb.is-drag .sb-thumb{cursor:grabbing;}
  .sb.is-drag .sb-thumb, .sb-thumb:active{background:var(--accent-bright);}
  html.sb-dragging, html.sb-dragging *{user-select:none; -webkit-user-select:none; cursor:grabbing !important;}
  /* Perangkat dengan mouse: tipis terlihat saat diam, membesar saat disorot */
  @media (pointer:fine){
    .sb{opacity:.45;}
    .sb:hover, .sb.is-active, .sb.is-drag{opacity:1;}
    .sb:hover, .sb.is-drag{background:rgba(255,255,255,.05);}
    .sb:hover .sb-thumb, .sb.is-drag .sb-thumb{width:10px; background:var(--accent-bright);}
  }
  /* Perangkat sentuh: hanya tampil sebentar saat di-scroll dan tidak menghalangi sentuhan */
  @media (pointer:coarse){
    .sb{pointer-events:none;}
    .sb.is-active .sb-thumb, .sb.is-drag .sb-thumb{pointer-events:auto; width:8px;}
  }

  /* ---------- Panel dock (muncul saat halaman di-scroll) ---------- */
  .dock{
    position:fixed; z-index:20;
    top:calc(env(safe-area-inset-top,0px) + 10px);
    left:12px; right:12px; margin:0 auto; max-width:1040px; height:var(--dock-h);
    display:flex; align-items:center; gap:14px; padding:0 14px 0 24px;
    visibility:hidden; pointer-events:none;
    transition:visibility 0s .45s;
  }
  .dock.is-on{visibility:visible; pointer-events:auto; transition:visibility 0s 0s;}
  /* Latar panel dipisah dari isinya supaya logo bisa "terbang" keluar dari kotak panel */
  .dock-bg{
    position:absolute; inset:0; border-radius:999px; overflow:hidden;
    background:rgba(23,23,21,.78); border:1px solid rgba(163,247,233,.16);
    -webkit-backdrop-filter:blur(16px) saturate(1.2); backdrop-filter:blur(16px) saturate(1.2);
    box-shadow:0 12px 32px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.05);
    opacity:0; transform:translateY(-18px) scale(.55,.7); transform-origin:50% 0;
    transition:transform .35s ease, opacity .3s ease;
  }
  .dock.is-on .dock-bg{
    opacity:1; transform:none;
    transition:transform .65s cubic-bezier(.2,.9,.25,1.12), opacity .3s ease;
  }
  .dock-bg::after{
    content:""; position:absolute; top:0; bottom:0; left:0; width:40%;
    background:linear-gradient(100deg, transparent, rgba(163,247,233,.16), transparent);
    transform:translateX(-130%);
  }
  .dock.is-on .dock-bg::after{animation:dock-sheen 1.2s ease .4s both;}
  @keyframes dock-sheen{to{transform:translateX(330%);}}

  .dock-mark{
    position:relative; flex:0 0 auto; display:block; height:34px; width:auto;
    transform-origin:0 0; will-change:transform; user-select:none; -webkit-user-drag:none;
    opacity:0; transition:opacity .2s ease;
  }
  .dock.is-on .dock-mark{opacity:1;}
  .dock-logo{
    position:relative; flex:0 0 auto; display:inline-block;
    font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:1.3rem;
    letter-spacing:-0.03em; line-height:1; color:var(--text); text-decoration:none;
    transform-origin:0 0; will-change:transform;
    opacity:0; transition:opacity .2s ease;
  }
  .dock.is-on .dock-logo{opacity:1;}
  .dock-logo:focus-visible, .dock-up:focus-visible{outline:2px solid var(--accent-bright); outline-offset:4px; border-radius:6px;}
  .dock-desc{
    position:relative; flex:1 1 auto; min-width:0;
    font-size:.86rem; line-height:1.3; color:var(--text-muted);
    padding-left:14px; border-left:1px solid var(--border);
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
    opacity:0; transform:translateX(-14px); clip-path:inset(0 100% 0 0);
    transition:opacity .2s ease, transform .2s ease, clip-path .2s ease;
  }
  .dock.is-on .dock-desc{
    opacity:1; transform:none; clip-path:inset(0 0 0 0);
    transition:opacity .45s ease .3s, transform .6s cubic-bezier(.2,.8,.2,1) .3s, clip-path .6s cubic-bezier(.2,.8,.2,1) .3s;
  }
  .dock-up{
    position:relative; flex:0 0 auto; width:36px; height:36px; margin-left:auto;
    display:inline-flex; align-items:center; justify-content:center; padding:0;
    border:1px solid var(--border); border-radius:999px; cursor:pointer;
    background:var(--bg-raised); color:var(--text);
    opacity:0; transition:opacity .2s ease, background-color .15s ease;
  }
  .dock.is-on .dock-up{opacity:1; transition:opacity .4s ease .5s, background-color .15s ease;}
  .dock-up svg{width:17px; height:17px;}
  @media (hover:hover){ .dock-up:hover{background:var(--accent); color:var(--accent-text); border-color:var(--accent);} }
  /* Dipakai saat halaman dimuat sudah dalam posisi ter-scroll: langsung tampil tanpa animasi */
  .dock.no-anim, .dock.no-anim *{transition:none !important; animation:none !important;}
  .dock.no-anim .dock-bg::after{display:none;}

  /* ---------- Tab kategori ---------- */
  .tabs{
    position:relative; display:flex; gap:4px; padding:4px; max-width:100%;
    background:rgba(23,23,21,.62); border:1px solid var(--border); border-radius:12px;
    -webkit-backdrop-filter:blur(14px) saturate(1.3); backdrop-filter:blur(14px) saturate(1.3);
    overflow-x:auto; scrollbar-width:none;
  }
  .tabs::-webkit-scrollbar{display:none;}
  .tab{
    position:relative; z-index:1; flex:0 0 auto; display:inline-flex; align-items:center; gap:8px;
    border:0; background:transparent; color:var(--text-muted); cursor:pointer;
    font:inherit; font-size:.9rem; font-weight:600; white-space:nowrap;
    padding:9px 16px; border-radius:9px;
    -webkit-tap-highlight-color:transparent;
    transition:background-color .2s ease, color .55s cubic-bezier(.65,0,.35,1);
  }
  .tab[aria-selected="true"]{color:var(--accent-text);}
  /* Pil penanda yang meluncur ke tab aktif */
  .tab-indicator{
    position:absolute; left:0; top:4px; bottom:4px; width:0; z-index:0;
    border-radius:9px; background:var(--accent); pointer-events:none;
    box-shadow:0 2px 12px rgba(111,163,155,.28);
    /* Easing in-out: mulai pelan, mempercepat di tengah, lalu mengerem halus di tujuan */
    --ease-io:cubic-bezier(.65,0,.35,1);
    transition:transform .55s var(--ease-io), width .55s var(--ease-io);
    will-change:transform,width;
  }
  .tab-indicator.no-anim{transition:none;}
  .tab:focus-visible{outline:2px solid var(--accent-bright); outline-offset:1px;}
  .tab-n{
    font-size:.74rem; font-weight:600; min-width:1.5em; text-align:center;
    padding:1px 6px; border-radius:999px; background:rgba(255,255,255,.08);
    transition:background-color .3s ease;
  }
  .tab[aria-selected="true"] .tab-n{background:rgba(11,20,17,.18);}
  .badge{
    position:absolute; left:10px; top:10px; z-index:1;
    font-size:.72rem; font-weight:600; color:var(--accent-bright);
    background:rgba(15,15,13,.82); border:1px solid rgba(163,247,233,.25);
    -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px);
    padding:3px 9px; border-radius:999px;
  }

  /* ---------- Grid & kartu ---------- */
  /* Flex + justify-content:center: kartu yang jumlahnya sedikit atau baris terakhir yang
     tidak penuh tetap rata di tengah, tidak menumpuk di kiri */
  .grid{
    display:flex; flex-wrap:wrap; justify-content:center; align-items:stretch; gap:16px;
  }
  .card{
    background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius);
    overflow:hidden; display:flex; flex-direction:column;
    flex:0 0 auto; width:320px; max-width:100%;
    transition:border-color .2s ease, background-color .2s ease;
  }
  @media (hover:hover){ .card:hover{border-color:var(--border-hover); background:#1A1A18;} }
  .card-media{
    position:relative; aspect-ratio:16/9; overflow:hidden; background:var(--bg-raised);
  }
  .card-img{
    width:100%; height:100%; object-fit:cover; display:block;
    transition:transform .4s ease;
  }
  @media (hover:hover){ .card:hover .card-img{transform:scale(1.04);} }
  .card-fallback{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-size:2.4rem; color:#3A3A35;
  }
  .card-body{padding:16px 18px 18px; display:flex; flex-direction:column; gap:6px; flex:1;}
  .card-name{
    font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:1.08rem;
    letter-spacing:-0.01em; line-height:1.25; overflow-wrap:anywhere;
  }
  .card-desc{
    color:var(--text-muted); font-size:.88rem; line-height:1.5; flex:1;
    display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden;
  }
  .card-meta{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    margin-top:4px; font-size:.78rem; color:#8A8A82; min-width:0;
  }
  .card-size{
    display:inline-flex; align-items:center; gap:6px; flex:0 0 auto;
    color:var(--text); font-weight:500;
    background:var(--bg-raised); border:1px solid var(--border);
    border-radius:999px; padding:3px 10px;
  }
  .card-size svg{width:13px; height:13px; color:var(--accent);}
  .card-host{overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0; margin-left:auto;}
  .btn{
    margin-top:10px; display:inline-flex; align-items:center; justify-content:center; gap:8px;
    border:0; font-family:inherit; cursor:pointer;
    background:var(--accent); color:var(--accent-text); text-decoration:none;
    padding:11px 14px; border-radius:10px; font-weight:600; font-size:.9rem;
    transition:background-color .15s ease, transform .1s ease;
  }
  .btn svg{width:17px; height:17px;}
  @media (hover:hover){ .btn:hover{background:var(--accent-bright);} }
  .btn:active{transform:scale(.98);}
  .btn:focus-visible{outline:2px solid var(--text); outline-offset:2px;}

  /* ---------- Keadaan kosong ---------- */
  .empty{
    text-align:center; color:var(--text-muted); margin:56px auto 0; max-width:36ch;
  }
  .empty strong{display:block; color:var(--text); font-family:'Space Grotesk',sans-serif; font-size:1.2rem; margin-bottom:6px;}
  .empty button{
    margin-top:16px; background:var(--bg-raised); color:var(--text); border:1px solid var(--border);
    border-radius:10px; padding:9px 16px; font:inherit; font-size:.9rem; cursor:pointer;
  }
  .empty button:hover{border-color:var(--border-hover);}
  .empty button:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}

  /* ---------- Footer ---------- */
  footer{
    position:relative; z-index:1; text-align:center; color:var(--text-muted); font-size:.82rem;
    padding:22px 16px; border-top:1px solid var(--border);
    background:rgba(15,15,13,.9);
  }

  /* Satu momen masuk saat halaman dibuka */
  @media (prefers-reduced-motion: no-preference){
    header > *{animation:klee-in .6s ease backwards;}
    header > p{animation-delay:.12s;}
    .search-bar{animation:klee-fade .6s ease .25s backwards;}
  }
  @keyframes klee-in{from{opacity:0; transform:translateY(12px);}}
  @keyframes klee-fade{from{opacity:0;}}

  @media (prefers-reduced-motion: reduce){
    .tab-indicator, .tab, .tab-n{transition:none;}
    .dock-bg, .dock.is-on .dock-bg{transform:none; transition:opacity .2s ease;}
    .dock-bg::after{display:none;}
    .dock-desc, .dock.is-on .dock-desc{transform:none; clip-path:none; transition:opacity .2s ease;}
  }

  /* Perangkat sentuh tidak punya tombol "/" */
  @media (hover:none){ .kbd{display:none;} }

  /* Layar HP landscape: bar pencarian tidak menempel supaya tidak memakan layar */
  @media (max-height:480px) and (orientation:landscape){
    .search-bar{position:static;}
  }

  /* ---------- Jendela konfirmasi download ---------- */
  html.modal-open{overflow:hidden;}
  .dl{
    position:fixed; inset:0; margin:auto; padding:0;
    width:min(480px, calc(100vw - 32px)); max-width:none; max-height:calc(100dvh - 32px);
    overflow-x:hidden; overflow-y:auto; scrollbar-width:thin; scrollbar-color:var(--accent) transparent;
    background:var(--bg-card); color:var(--text);
    border:1px solid var(--border); border-radius:20px;
    box-shadow:0 30px 80px rgba(0,0,0,.6);
    opacity:0; transform:translateY(14px) scale(.97);
    transition:opacity .26s ease, transform .3s cubic-bezier(.2,.8,.2,1);
  }
  .dl.is-open{opacity:1; transform:none;}
  .dl::backdrop{
    background:rgba(4,8,10,.62);
    -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px);
    opacity:0; transition:opacity .26s ease;
  }
  .dl.is-open::backdrop{opacity:1;}

  .dl-media{position:relative; aspect-ratio:16/9; background:var(--bg-raised); overflow:hidden;}
  .dl-media img{width:100%; height:100%; object-fit:cover; display:block;}
  .dl-media::after{
    content:""; position:absolute; inset:-1px; pointer-events:none;
    background:linear-gradient(to top,
      var(--bg-card) 0%,
      rgba(23,23,21,.88) 12%,
      rgba(23,23,21,.55) 26%,
      rgba(23,23,21,.26) 42%,
      rgba(23,23,21,.08) 58%,
      rgba(23,23,21,0) 72%
    );
  }
  .dl-cat{
    position:absolute; left:16px; bottom:12px; z-index:1;
    font-size:.74rem; font-weight:600; color:var(--accent-bright);
    background:rgba(15,15,13,.8); border:1px solid rgba(121,240,255,.28);
    -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px);
    padding:3px 10px; border-radius:999px;
  }
  .dl-x{
    position:absolute; top:12px; right:12px; z-index:3; width:38px; height:38px; padding:0;
    display:inline-flex; align-items:center; justify-content:center; cursor:pointer;
    border:1px solid rgba(255,255,255,.14); border-radius:999px; color:var(--text);
    background:rgba(15,15,13,.6);
    -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px);
  }
  .dl-x svg{width:18px; height:18px;}

  .dl-body{padding:18px 22px 22px; display:flex; flex-direction:column; gap:14px;}
  .dl.no-media .dl-body{padding-top:24px; padding-right:62px;}
  .dl-title{
    font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:1.3rem;
    letter-spacing:-0.01em; line-height:1.25; margin:0; overflow-wrap:anywhere;
  }
  .dl-desc{margin:0; color:var(--text-muted); font-size:.93rem; line-height:1.55; overflow-wrap:anywhere;}

  .dl-info{margin:0; border:1px solid var(--border); border-radius:12px; background:var(--bg); overflow:hidden;}
  .dl-row{display:flex; align-items:center; gap:12px; padding:12px 14px; min-width:0;}
  .dl-row + .dl-row{border-top:1px solid var(--border);}
  .dl-row dt{
    display:flex; align-items:center; gap:8px; flex:0 0 auto; width:116px;
    color:var(--text-muted); font-size:.85rem;
  }
  .dl-row dt svg{width:16px; height:16px; color:var(--accent-bright); flex:0 0 auto;}
  .dl-row dd{margin:0; flex:1; min-width:0; font-size:.93rem; font-weight:600;}
  .dl-link{display:flex; align-items:center; gap:8px; min-width:0;}
  .dl-link span{
    flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:.8rem;
    font-weight:500; color:var(--accent-bright);
  }
  .dl-copy{
    flex:0 0 auto; width:34px; height:34px; padding:0; cursor:pointer;
    display:inline-flex; align-items:center; justify-content:center;
    border:1px solid var(--border); border-radius:9px; background:var(--bg-raised); color:var(--text);
    transition:border-color .15s ease, color .15s ease;
  }
  .dl-copy svg{width:15px; height:15px;}
  .dl-copy.is-done{color:var(--accent-bright); border-color:var(--accent);}
  .dl-note{margin:0; font-size:.8rem; line-height:1.45; color:#8A8A82;}

  .dl-actions{display:flex; gap:10px; margin-top:2px;}
  .dl-btn{
    flex:1; min-height:48px; padding:0 16px; display:inline-flex; align-items:center; justify-content:center; gap:8px;
    font:inherit; font-size:.95rem; font-weight:600; text-decoration:none; cursor:pointer;
    border:1px solid transparent; border-radius:12px;
    transition:background-color .15s ease, border-color .15s ease, transform .1s ease;
  }
  .dl-btn svg{width:18px; height:18px;}
  .dl-btn.ghost{background:var(--bg-raised); color:var(--text); border-color:var(--border);}
  .dl-btn.primary{flex:1.6; background:var(--accent); color:var(--accent-text);}
  .dl-btn:active{transform:scale(.98);}
  .dl-btn:focus-visible, .dl-x:focus-visible, .dl-copy:focus-visible{outline:2px solid var(--accent-bright); outline-offset:2px;}
  @media (hover:hover){
    .dl-btn.primary:hover{background:var(--accent-bright);}
    .dl-btn.ghost:hover, .dl-copy:hover{border-color:var(--border-hover);}
    .dl-x:hover{background:rgba(15,15,13,.88);}
  }
  @media (prefers-reduced-motion: reduce){
    .dl, .dl::backdrop{transition:opacity .15s ease;}
    .dl{transform:none !important;}
  }

  /* ---------- Tablet: kolom menyesuaikan lebar layar ---------- */
  /* 521-767px (tablet portrait kecil): 2 kolom */
  @media (min-width:521px) and (max-width:767px){
    .card{width:calc((100% - 16px) / 2); max-width:none;}
  }
  /* 768px ke atas (tablet besar, laptop kecil): 3 kolom, maksimal 320px per kartu */
  @media (min-width:768px){
    .card{width:calc((100% - 32px) / 3); max-width:320px;}
  }

  /* ---------- Mobile ---------- */
  @media (max-width:520px){
    :root{--dock-h:58px;}
    .dock{left:10px; right:10px; gap:10px; padding:0 18px;}
    .dock-logo{font-size:1.15rem;}
    .dock-mark{height:28px;}
    .hero-mark{margin-bottom:10px;}
    .dock-desc{
      font-size:.72rem; line-height:1.25; padding-left:10px;
      white-space:normal; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;
    }
    .dock-up{display:none;}
    .search-bar{top:calc(env(safe-area-inset-top,0px) + var(--dock-h) + 14px);}
    .wrap{
      padding:36px max(16px, env(safe-area-inset-right)) 28px max(16px, env(safe-area-inset-left));
    }
    header{margin-bottom:22px;}
    header p{font-size:.95rem;}

    /* Bar menempel dibuat lebih ramping. Tanpa latar solid, supaya kaca buram di
       kolom pencarian dan tab terlihat tembus ke kartu di belakangnya */
    .search-bar{
      gap:6px; padding:8px 16px 10px; margin:0 -16px 6px;
    }
    .search-box{max-width:none;}
    /* 16px mencegah iOS memperbesar layar otomatis saat kolom pencarian disentuh */
    #search{font-size:16px; padding:13px 46px 13px 46px;}
    #clear{width:40px; height:40px; right:3px;}

    .tabs{width:100%;}
    .tab{flex:1 0 auto; justify-content:center; padding:11px 10px; font-size:.84rem; gap:6px;}
    .tab-n{font-size:.7rem; padding:1px 5px;}

    /* 2 kartu per baris di HP; kalau cuma satu, tetap setengah lebar dan di tengah */
    .grid{gap:10px;}
    .card{width:calc((100% - 10px) / 2);}
    .card-body{padding:10px 12px 12px; gap:4px;}
    .card-name{font-size:.92rem; line-height:1.25;}
    .card-desc{font-size:.76rem; line-height:1.4; -webkit-line-clamp:3;}
    .card-meta{margin-top:2px;}
    .card-host{display:none;}   /* ruang sempit: tampilkan ukuran saja */
    .card-size{font-size:.72rem; padding:2px 8px; gap:5px;}
    .card-size svg{width:12px; height:12px;}
    .badge{left:6px; top:6px; font-size:.64rem; padding:2px 7px;}
    .btn{min-height:42px; margin-top:8px; font-size:.84rem; gap:6px; padding:9px 8px;}

    /* Jendela konfirmasi di HP: naik dari bawah layar */
    .dl{
      inset:auto 0 0 0; margin:0; width:100%;
      max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px));
      border-width:1px 0 0; border-radius:22px 22px 0 0;
      opacity:1; transform:translateY(100%);
    }
    .dl.is-open{transform:none;}
    .dl-body{padding:16px 18px calc(18px + env(safe-area-inset-bottom,0px));}
    .dl.no-media .dl-body{padding-top:22px;}
    .dl-row dt{width:100px;}
    .dl-title{font-size:1.2rem;}
    .btn svg{width:15px; height:15px;}
    .empty{margin-top:36px;}
    footer{font-size:.78rem; padding:18px 16px;}
  }
</style>
</head>

<script>
  /* ====== LATAR: JARINGAN PARTIKEL ======
     Titik-titik mint melayang pelan dan saling terhubung garis tipis saat berdekatan.
     Di desktop, kursor mouse ikut "menarik" garis dari titik di sekitarnya. */
  (function(){
    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const isCoarse = window.matchMedia('(pointer:coarse)').matches;
    const canvas = document.getElementById('matrixCanvas');
    const ctx = canvas.getContext('2d');
    const LINK = isCoarse ? 105 : 140;       // jarak maksimum dua titik terhubung
    const MOUSE_R = 170;                      // jangkauan kursor
    const MAX = isCoarse ? 55 : 110;
    let w = 0, h = 0, pts = [];
    const mouse = { x:-9999, y:-9999, on:false };

    function spawn(){
      const a = Math.random() * Math.PI * 2, sp = 8 + Math.random() * 16;
      return {
        x: Math.random() * w, y: Math.random() * h,
        vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
        r: 1.1 + Math.random() * 1.5, ph: Math.random() * Math.PI * 2
      };
    }
    function resize(){
      const dpr = Math.min(window.devicePixelRatio || 1, isCoarse ? 1.5 : 2);
      w = window.innerWidth; h = window.innerHeight;
      canvas.width = w * dpr; canvas.height = h * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      // Jumlah titik mengikuti luas layar; titik yang sudah ada tidak diacak ulang
      const want = Math.min(MAX, Math.max(24, Math.round(w * h / (isCoarse ? 16000 : 12000))));
      while(pts.length < want) pts.push(spawn());
      if(pts.length > want) pts.length = want;
      pts.forEach(p => { p.x = Math.min(p.x, w); p.y = Math.min(p.y, h); });
      if(reduceMotion) draw(0, 0);
    }

    function draw(dt, time){
      ctx.clearRect(0, 0, w, h);
      for(const p of pts){
        p.x += p.vx * dt; p.y += p.vy * dt;
        if(p.x < 0){ p.x = 0; p.vx = Math.abs(p.vx); } else if(p.x > w){ p.x = w; p.vx = -Math.abs(p.vx); }
        if(p.y < 0){ p.y = 0; p.vy = Math.abs(p.vy); } else if(p.y > h){ p.y = h; p.vy = -Math.abs(p.vy); }
        if(mouse.on){   // dorongan halus menjauhi kursor
          const dx = p.x - mouse.x, dy = p.y - mouse.y, d = Math.hypot(dx, dy);
          if(d < 90 && d > 0){ const f = (1 - d / 90) * 50 * dt; p.x += dx / d * f; p.y += dy / d * f; }
        }
      }
      ctx.lineWidth = 1;
      for(let i = 0; i < pts.length; i++){
        const a = pts[i];
        for(let j = i + 1; j < pts.length; j++){
          const b = pts[j], dx = a.x - b.x, dy = a.y - b.y;
          if(dx > LINK || dx < -LINK || dy > LINK || dy < -LINK) continue;
          const d = Math.hypot(dx, dy);
          if(d >= LINK) continue;
          ctx.strokeStyle = 'rgba(58,201,240,' + ((1 - d / LINK) * 0.2).toFixed(3) + ')';
          ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
        }
        if(mouse.on){
          const dx = a.x - mouse.x, dy = a.y - mouse.y, d = Math.hypot(dx, dy);
          if(d < MOUSE_R){
            ctx.strokeStyle = 'rgba(58,201,240,' + ((1 - d / MOUSE_R) * 0.45).toFixed(3) + ')';
            ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(mouse.x, mouse.y); ctx.stroke();
          }
        }
      }
      for(const p of pts){
        const glow = 0.45 + 0.25 * Math.sin(time / 900 + p.ph);   // kedip lembut
        ctx.fillStyle = 'rgba(58,201,240,' + glow.toFixed(2) + ')';
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.2832); ctx.fill();
      }
    }

    resize();
    let rt; window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(resize, 150); });
    if(reduceMotion) return;

    window.addEventListener('pointermove', e => {
      if(e.pointerType !== 'mouse') return;
      mouse.x = e.clientX; mouse.y = e.clientY; mouse.on = true;
    }, { passive:true });
    document.addEventListener('pointerleave', () => { mouse.on = false; });
    window.addEventListener('blur', () => { mouse.on = false; });

    let last = null, running = true;
    function frame(time){
      if(!running) return;
      if(last === null) last = time;
      // Di HP dibatasi ±30 fps supaya baterai dan performa tetap aman
      if(isCoarse && time - last < 33){ requestAnimationFrame(frame); return; }
      const dt = Math.min(time - last, 50) / 1000;
      last = time;
      draw(dt, time);
      requestAnimationFrame(frame);
    }
    // Hemat baterai: berhenti saat tab tidak terlihat
    document.addEventListener('visibilitychange', () => {
      running = !document.hidden;
      if(running){ last = null; requestAnimationFrame(frame); }
    });
    requestAnimationFrame(frame);
  })();

  /* ====== DATABASE ITEM ======
     Semua file di KleeVault diambil dari array DATA di bawah ini.
     Tambah item baru dengan menyalin satu blok { ... } lalu isi datanya,
     simpan, dan deploy ulang ke Vercel. Item paling atas tampil paling dulu.

     Kolom wajib:
       name      Nama item
       desc      Deskripsi item
       link      Link tujuan tombol Download (harus diawali http:// atau https://)
       size      Ukuran file, tulis bebas dengan satuannya, contoh "85 MB" atau "1.2 GB"

     Kolom opsional:
       category  "Aplikasi Mod" atau "Game Port". Kalau kosong, item hanya muncul di tab Semua.
       image     URL gambar sampul. Kalau kosong, kartu tampil tanpa gambar.

     Contoh:
       {
         name: "Nama Item",
         desc: "Deskripsi singkat tentang item ini.",
         link: "https://safelinku.com/xxxxx",
         size: "85 MB",
         category: "Game Port",
         image: "https://url-gambar.jpg"
       },
  */

      image: "https://files.catbox.moe/exggqc.jpg"
    },

  (function(){

    [{ opacity:0, transform:"translateY(12px)" }, { opacity:1, transform:"none" }],
    { duration:600, delay:250, easing:EASE_OUT, fill:"backwards" }
  );
</script>
